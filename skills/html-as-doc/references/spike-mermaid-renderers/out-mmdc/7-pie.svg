<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 662.9375 450" style="max-width: 662.938px; background-color: transparent;" role="graphics-document document" aria-roledescription="pie"><style>#my-svg{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:14px;fill:#1D1D1F;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#552222;}#my-svg .error-text{fill:#552222;stroke:#552222;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#86868B;stroke:#86868B;}#my-svg .marker.cross{stroke:#86868B;}#my-svg svg{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:14px;}#my-svg p{margin:0;}#my-svg .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#my-svg .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#my-svg .pieTitleText{text-anchor:middle;font-size:25px;fill:#333;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;}#my-svg .slice{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;fill:#1D1D1F;font-size:17px;}#my-svg .legend text{fill:#333;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:17px;}#my-svg .node .neo-node{stroke:#999;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter: