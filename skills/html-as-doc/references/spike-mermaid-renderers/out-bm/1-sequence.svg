<line class="lifeline" data-actor="S" x1="518.854" y1="70" x2="518.854" y2="455" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="U" data-to="C" data-label="click Highlight" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="97.47300000000001" y1="90" x2="237.473" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="167.473" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">click Highlight</text>
</g>
