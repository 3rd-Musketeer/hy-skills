  <text x="448.1635" y="325" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">ok</text>
</g>
<g class="message" data-from="B" data-to="S" data-label="insert note" data-line-style="solid" data-arrow-head="open" data-self="false">
  <line x1="377.473" y1="375" x2="518.854" y2="375" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow-open)" />
  <text x="448.1635" y="365" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">insert note</text>
</g>
<g class="message" data-from="S" data-to="B" data-label="ok" data-line-style="dashed" data-arrow-head="open" data-self="false">
  <line x1="518.854" y1="415" x2="377.473" y2="415" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow-open)" />
  <text x="448.1635" y="405" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">ok</text>
</g>
