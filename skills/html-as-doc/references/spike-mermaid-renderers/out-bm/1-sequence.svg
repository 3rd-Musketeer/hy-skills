  <polygon points="30,193 158.94600000000003,193 164.94600000000003,199 164.94600000000003,216 30,216" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="158.94600000000003,193 164.94600000000003,199 158.94600000000003,199" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="97.47300000000001" y="204.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">用户看到高亮 · &lt; 5 ms</text>
</g>
