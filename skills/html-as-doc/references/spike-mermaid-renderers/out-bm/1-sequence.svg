  <text x="307.473" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">create-note</text>
</g>
<g class="message" data-from="B" data-to="C" data-label="broadcast" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="377.473" y1="185" x2="237.473" y2="185" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="307.473" y="175" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">broadcast</text>
</g>
