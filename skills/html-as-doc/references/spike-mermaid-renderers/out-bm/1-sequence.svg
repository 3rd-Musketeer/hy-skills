  <polygon points="320.395,138 428.55100000000004,138 434.55100000000004,144 434.55100000000004,161 320.395,161" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="428.55100000000004,138 434.55100000000004,144 428.55100000000004,144" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
